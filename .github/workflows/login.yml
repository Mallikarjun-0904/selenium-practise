name: Student Login Automation Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  login-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Run Maven Tests
        run: mvn clean test
        continue-on-error: true

      - name: Display TestNG Reports
        if: always()
        run: |
          echo "===== TESTNG REPORTS ====="
          cat target/surefire-reports/*.txt || true
          echo "===== XML REPORTS ====="
          grep -E 'testcase|failure|error' target/surefire-reports/testng-results.xml || true

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testng-reports
          path: target/surefire-reports/

